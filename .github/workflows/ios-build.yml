name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find Xcode project
        run: |
          echo "Xcode projects:"
          find . -name "*.xcodeproj" -maxdepth 3 -print

      - name: Build app
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)

          echo "Using project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find built app
        run: |
          find DerivedData -name "*.app" -type d -print

      - name: Package app
        run: |
          APP=$(find DerivedData -path "*Debug-iphonesimulator/*.app" -type d | head -n 1)

          echo "Using app: $APP"

          mkdir -p artifact

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "artifact/FlowMessenger-simulator.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowMessenger-iOS
          path: artifact/FlowMessenger-simulator.zip
