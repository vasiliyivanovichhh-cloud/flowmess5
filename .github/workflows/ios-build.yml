name: iOS Hello Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project HelloFlow.xcodeproj -scheme HelloFlow -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package
        run: |
          APP="$(find DerivedData -path '*Debug-iphonesimulator/*.app' -type d | head -n 1)"
          test -n "$APP"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifact/Hello-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hello-iOS
          path: artifact/Hello-iOS-Simulator.zip
