name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d FlowMessenger.xcodeproj
          xcodebuild -list -project FlowMessenger.xcodeproj
      - name: Find simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | grep -E 'iPhone' | grep -v unavailable | head -n 1 | sed -E 's/^[[:space:]]*([^ (]+( [^ (]+)*) \(.*/\1/' || true)"
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          echo "DESTINATION=platform=iOS Simulator,name=$DEVICE" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project FlowMessenger.xcodeproj -scheme FlowMessenger -sdk iphonesimulator -destination "$DESTINATION" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package
        run: |
          set -euo pipefail
          APP="$(find DerivedData -path '*Debug-iphonesimulator/*.app' -type d | head -n 1)"
          test -n "$APP"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifact/FlowMessenger-iOS-Simulator.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FlowMessenger-iOS
          path: artifact/FlowMessenger-iOS-Simulator.zip
