name: Luma
options:
  bundleIdPrefix: com.apple
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.apple.flow
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_NSCameraUsageDescription: Luma uses the camera to send photos and videos.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Luma uses your photo library to send media.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Luma uses the microphone to record voice messages.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Luma:
    type: application
    platform: iOS
    sources:
      - path: MessengerApp
    resources:
      - path: GoogleService-Info.plist
    settings:
      base:
        PRODUCT_NAME: Luma
        INFOPLIST_KEY_CFBundleDisplayName: Luma
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
