name: FlowMessenger
options:
  bundleIdPrefix: com.flowmessenger
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.flowmessenger.app
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_NSCameraUsageDescription: Flow uses the camera to send media.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Flow uses the photo library to send media.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Flow uses the microphone for voice messages.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  FlowMessenger:
    type: application
    platform: iOS
    sources:
      - path: MessengerApp
    resources:
      - path: GoogleService-Info.plist
    settings:
      base:
        PRODUCT_NAME: Flow
        INFOPLIST_KEY_CFBundleDisplayName: Flow
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
